<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<title>TheNoise</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="tabs">
  <span class="logo">The<span class="logo-accent">Noise</span></span>
  <button class="tab ctrl active" data-tab="generate">Generate</button>
  <button class="tab ctrl" data-tab="upscale">Upscale</button>
</div>

<div class="views">
<div class="view" id="view-generate">
<aside class="sidebar">
  <div class="field">
    <label class="label" for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Describe the image…"></textarea>
  </div>

  <div class="field">
    <label class="label" for="negative_prompt">Negative prompt <span class="hint">optional</span></label>
    <textarea id="negative_prompt" placeholder=""></textarea>
  </div>

  <div class="divider"></div>

  <div class="swap-row">
    <div class="field">
      <label class="label" for="width">Width</label>
      <input type="number" id="width" placeholder="auto" value="1024">
      <span class="hint">Max 4096</span>
    </div>
    <button class="swap ctrl" id="swap" title="Swap width and height"
      aria-label="Swap width and height">&#8646;</button>
    <div class="field">
      <label class="label" for="height">Height</label>
      <input type="number" id="height" placeholder="auto" value="1024">
      <span class="hint">Max 4096</span>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label class="label" for="steps">Steps</label>
      <input type="number" id="steps" placeholder="auto">
    </div>
    <div class="field">
      <label class="label" for="guidance_scale">Guidance</label>
      <input type="number" id="guidance_scale" step="0.1" placeholder="auto">
    </div>
  </div>

  <div class="field">
    <label class="label" for="sampler">Sampler</label>
    <select id="sampler">
      <option value="er_sde">er_sde</option>
      <option value="euler">euler</option>
    </select>
  </div>

  <div class="field">
    <label class="label" for="seed">Seed</label>
    <input type="number" id="seed" placeholder="random">
  </div>

  <div class="divider"></div>

  <div class="range">
    <div class="range-head">
      <label class="label" for="film_grain">Film grain</label>
      <span class="val" id="film_grain_val">0.00</span>
    </div>
    <input type="range" id="film_grain" min="0" max="1" step="0.1" value="0">
  </div>

  <div class="range">
    <div class="range-head">
      <label class="label" for="sharpening">Sharpening</label>
      <span class="val" id="sharpening_val">0.00</span>
    </div>
    <input type="range" id="sharpening" min="0" max="1" step="0.05" value="0">
  </div>

  <div class="field">
    <label class="label" for="upscale_type">Upscale type</label>
    <select id="upscale_type">
      <option value="refined">refined (latent 2x + refiner)</option>
      <option value="no-refiner">no-refiner (pixel upscaler only)</option>
    </select>
  </div>

  <div class="field">
    <label class="label" for="pixel_upscaler">Pixel upscaler <span class="hint">(from --upscaler-dir)</span></label>
    <select id="pixel_upscaler">
      <option value="">none</option>
    </select>
  </div>

  <div class="range">
    <div class="range-head">
      <label class="label" for="upscale_factor">Upscale factor</label>
      <span class="val" id="upscale_factor_val">1.00</span>
    </div>
    <input type="range" id="upscale_factor" min="1" max="8" step="0.25" value="1">
    <span class="final-res" id="final_res"></span>
  </div>

  <label class="check"><input type="checkbox" id="qwen_vae_enhance"> Reduce grid pattern <span
      class="hint">(enable when needed)</span></label>

  <div class="divider"></div>

  <div class="field lora-field">
    <label class="label" for="lora_specs">LoRA specs <span class="hint">type to autocomplete</span></label>
    <textarea id="lora_specs" rows="2" placeholder="e.g. style:0.8, one per line"></textarea>
    <div class="lora-ac" id="lora_ac"></div>
  </div>

  <button class="btn" id="generate">Generate</button>
</aside>

<main class="main">
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">Enter a prompt and click <span class="kbd">Generate</span></div>
    <img id="image" alt="generated" style="display:none">
    <button class="dl ctrl" id="download" disabled title="Download PNG">&#8595; Download</button>
    <div class="overlay hidden" id="overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <div class="timer" id="timer"><span class="dot"></span><span id="timer_text">idle</span></div>

  <details class="info" id="info">
    <summary class="label"><span class="chev">&#9654;</span> Image info</summary>
    <div class="info-body">
      <dl class="info-grid" id="info_grid"></dl>
    </div>
  </details>

  <div class="history hidden" id="history">
    <div class="history-head label">History</div>
    <div class="history-items" id="history_items"></div>
  </div>
</main>
</div><!-- /view-generate -->

<div class="view hidden" id="view-upscale">
<aside class="sidebar">
  <div class="field">
    <label class="label" for="file">Input image</label>
    <div class="dropzone" id="dropzone">
      <input type="file" id="file" accept="image/*" hidden>
      <div class="dz-hint" id="dz_hint">Drag &amp; drop an image here or <span class="kbd">click to browse</span>
      </div>
      <div class="dz-name" id="dz_name" style="display:none"></div>
    </div>
  </div>

  <div class="field">
    <label class="label" for="upscaler_model">Upscaler model <span class="hint">(from --upscaler-dir)</span></label>
    <select id="upscaler_model"></select>
  </div>

  <div class="row">
    <div class="field">
      <label class="label" for="max_res">Max resolution <span class="hint">px</span></label>
      <input type="number" id="max_res" placeholder="auto">
    </div>
    <div class="field">
      <label class="label" for="u_scale">Scale factor</label>
      <input type="number" id="u_scale" step="0.25" placeholder="auto">
    </div>
  </div>

  <button class="btn" id="upscale" disabled>Upscale</button>
</aside>

<main class="main">
  <div class="stage" id="ustage">
    <div class="placeholder" id="uplaceholder">No image selected</div>
    <div class="single hidden" id="usingle">
      <img id="usingle_img" alt="input image">
    </div>
    <div class="result hidden" id="uresult">
      <img id="u_img" alt="upscaled">
    </div>
    <button class="dl ctrl" id="udownload" disabled title="Download PNG">&#8595; Download</button>
    <div class="overlay hidden" id="uoverlay"><div class="spinner"></div></div>
  </div>

  <div class="timer" id="utimer"><span class="dot"></span><span id="utimer_text">idle</span></div>

  <details class="info" id="uinfo">
    <summary class="label"><span class="chev">&#9654;</span> Upscale info</summary>
    <div class="info-body">
      <dl class="info-grid" id="uinfo_grid"></dl>
    </div>
  </details>
</main>
</div><!-- /view-upscale -->
</div><!-- /views -->
<script src="static/app.js"></script>
</body>
</html>
